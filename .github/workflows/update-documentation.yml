name: Maintain Documentation

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test documentation contracts without training
        run: python -m unittest discover -s tests -p "test_documentation.py" -v
      - name: Refresh generated documentation
        run: python generate_documentation.py
      - name: Check freshness
        run: python generate_documentation.py --check
      - name: Commit documentation changes
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- docs/PROJECT_GUIDE.md docs/RESULTS.md README.md
          if git diff --cached --quiet; then
            echo "Documentation is already current."
            exit 0
          fi
          git fetch origin "$TARGET_BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "A newer push is present; its workflow will refresh documentation."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh generated project documentation"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

  check-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test documentation contracts without training
        run: python -m unittest discover -s tests -p "test_documentation.py" -v
      - name: Check generated documentation is included
        run: python generate_documentation.py --check
